version: "2"
services:
  mongodb:
    image: mongo:4.0
    hostname: mongodb
    container_name: mongodb
    expose:
      - "27017"
    ports:
      - "27018:27017"
    volumes:
      - mongodb-volume:/data
    command: mongod --smallfiles

  orion:
    image: fiware/orion:latest
    hostname: orion
    container_name: orion
    depends_on:
      - mongodb
    links:
      - mongodb
    expose:
      - "1026"
    ports:
      - "1026:1026"
    command: -dbURI mongodb://mongodb:27017 -logLevel DEBUG -t 2

  api:
    build: ./api
    ports:
      - "8080:8080"

  front:
    build: ./frontend
    ports:
      - "3000:3000"

volumes:
  mongodb-volume:
